[workspace]
members = [
    "crates/nerd-core",
    "crates/nerd-daemon",
    "crates/nerd-cli",
    "crates/nerd-helper",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
hickory-server = { version = "=0.26.1" }
http = { version = "=1.5.0" }
http-body-util = { version = "=0.1.5" }
hyper = { version = "=1.11.0", features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
jsonschema = { version = "=0.49.9", default-features = false }
rcgen = { version = "=0.14.9" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "default-tls"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring"] }
rustls-pemfile = { version = "=2.2.0" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0" }
time = { version = "=0.3.55", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "signal",
    "sync",
    "time",
] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }
uuid = { version = "=1.24.0", default-features = false, features = ["serde", "std", "v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
